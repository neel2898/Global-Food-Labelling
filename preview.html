<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Label Preview</title>
<style>
  :root{
    --yellow:#FFD700; --pin:#F5B800; --pin-ink:#1B2230; --blue:#2F80ED; --accent:#2456C9;
    --ink:#1B2230; --muted:#6B6A68; --muted2:#56607A; --line:#E4E6EA; --line2:#C9D3E3;
    --soft:#F6F7F9; --lm:#2456C9; --lm-bg:#EAF1FF; --lm-line:#BBD0F3;
    --fssai:#8A4B00; --fssai-bg:#FBEEDD; --fssai-line:#EAC9A0;
    --hl:#FFF7DD; --hl-line:#F3CE4A; --barbg:#FFF8E1; --barline:#F3D98A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:rgba(20,24,33,.55);color:var(--ink);font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .art{font-family:Arial,Helvetica,sans-serif}

  /* ===================== 90% modal shell ===================== */
  .lp{position:fixed;top:5vh;left:5vw;width:90vw;height:90vh;z-index:1000;background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(10,14,24,.45);display:flex;flex-direction:column;overflow:hidden}
  .lp-head{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
  .lp-head h1{margin:0;font-size:18px;font-weight:700}
  .lp-head .prod{font-size:13px;color:var(--muted2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lp-spacer{flex:1}
  .tabs{display:inline-flex;gap:3px;padding:3px;background:#E3E9F2;border-radius:9px}
  .tabs .t{height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted2)}
  .tabs .t.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(20,32,60,.16)}
  .flag{width:18px;height:12px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
  .hbtn{height:36px;padding:0 13px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line2);border-radius:8px;background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
  .hbtn .ic{width:16px;height:16px}
  .hbtn:hover{border-color:#9FB2D6}
  .hbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hbtn.on .ic{stroke:#fff}
  .lp-x{width:34px;height:34px;border:0;background:none;color:var(--muted2);font-size:20px;border-radius:8px}
  .lp-x:hover{background:var(--soft)}
  .divv{width:1px;height:26px;background:var(--line)}

  .lp-cbar{display:flex;align-items:center;gap:10px;padding:9px 20px;background:var(--barbg);border-bottom:1px solid var(--barline);font-size:13px;color:#5C3300;flex-shrink:0}
  .lp-cbar .done{margin-left:auto;font-weight:700;color:var(--accent);background:none;border:0}

  .lp-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
  .lp-scroll{overflow:auto;padding:24px 22px 56px}
  .lp-stage{display:grid;grid-template-columns:46px minmax(0,600px) 250px;max-width:940px;margin:0 auto;position:relative}
  .lp-addcol,.lp-callcol{position:relative}
  .lp-card{background:#fff;border:1px solid #D7DBE2;border-radius:4px}
  .lp-card .art{color:#111;padding:24px 26px}

  .addbtn{position:absolute;left:7px;width:28px;height:28px;border-radius:50%;border:1.5px dashed #B9C0CD;background:#fff;color:#8A93A6;font-size:17px;line-height:1;display:none;align-items:center;justify-content:center}
  .lp.commenting .addbtn{display:flex}
  .addbtn:hover{border-color:var(--accent);color:var(--accent)}
  .pin{position:absolute;left:7px;width:28px;height:28px;border-radius:50%;background:var(--pin);color:var(--pin-ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:2}
  .pin.dashed{background:#fff;border:1.5px dashed var(--pin);color:#9A7400;box-shadow:none}
  .pin.sel{outline:2px solid var(--accent);outline-offset:1px}

  .callhdr{font-size:11px;font-weight:700;color:var(--ink);letter-spacing:.3px}
  .callhdr .sub{font-weight:400;color:var(--muted);font-size:10.5px;line-height:1.4;margin-top:2px}
  .call{position:absolute;left:0;display:none;align-items:flex-start;width:244px}
  .lp.showcall .call{display:flex}
  .call .tick{flex-shrink:0;width:14px;border-top:1.5px dotted #B9C0CD;margin-top:9px}
  .call .ca{display:flex;flex-direction:column;gap:2px}
  .call .r1{display:flex;align-items:center;gap:6px}
  .call .mm{font-size:12px;font-weight:800;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace}
  .tag{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.3px;white-space:nowrap}
  .tag.a{color:var(--lm);background:var(--lm-bg);border:1px solid var(--lm-line)}
  .tag.b{color:var(--fssai);background:var(--fssai-bg);border:1px solid var(--fssai-line)}
  .call .r2{font-size:11px;color:var(--muted)}
  .call .nomin{font-size:12px;font-weight:700;color:var(--muted2);font-family:ui-monospace,monospace}

  .el{scroll-margin-top:90px}
  .el.hl{background:var(--hl);outline:2px solid var(--hl-line);outline-offset:3px;border-radius:3px}

  .brandlogo{width:150px;height:54px;border:1px dashed #B9C0CD;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#8A93A6;font-size:12px;margin:0 auto}
  .pname{font-size:22px;font-weight:800;line-height:1.15}
  .vlogo{width:20px;height:20px;border:2px solid #0A8A2E;border-radius:3px;display:flex;align-items:center;justify-content:center}
  .vlogo i{width:9px;height:9px;border-radius:50%;background:#0A8A2E;display:block}
  .nf{border:1px solid #000;font-size:12px}
  .nf .hd{font-weight:800;padding:5px 8px;border-bottom:1px solid #000}
  .nf .sv{display:flex;justify-content:space-between;padding:4px 8px;font-weight:700;border-bottom:1px solid #000}
  .nf table{width:100%;border-collapse:collapse}
  .nf th,.nf td{border:1px solid #000;padding:4px 8px;text-align:left;font-weight:400}
  .nf th{font-weight:700}
  .nf td.n,.nf th.n{text-align:center}
  .nf .ft{padding:5px 8px;border-top:1px solid #000}
  /* US nutrition facts */
  .usnf{border:1.5px solid #000;padding:4px 8px 8px;width:300px;font-size:12px}
  .usnf h3{margin:0;font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1}
  .usnf .rule{border-bottom:1px solid #000}
  .usnf .rule.thick{border-bottom-width:8px}
  .usnf .rule.mid{border-bottom-width:4px}
  .usnf .r{display:flex;justify-content:space-between;font-size:12px;line-height:1.5}
  .usnf .r.b{font-weight:800}
  .usnf .ind{padding-left:14px}.usnf .ind2{padding-left:26px}
  .usnf .sm{font-size:10px;line-height:1.35}
  .declbox{border:1px solid #CDd3dd;border-radius:6px;overflow:hidden}
  .declrow{display:grid;grid-template-columns:200px 1fr;gap:10px;padding:11px 14px;border-top:1px solid #EDEFF2}
  .declrow:first-child{border-top:0}
  .declrow .k{font-weight:700;font-size:13px}
  .declrow .v{font-size:13px}
  .ghost{border:1px dashed #B9C0CD;border-radius:4px;color:#8A93A6;font-size:11px;padding:8px 10px;display:flex;align-items:center;justify-content:center}

  .reg-note{border:1px solid var(--line);background:#FcFcFb;border-radius:8px;padding:14px 16px;font-size:11px;line-height:1.55;color:var(--muted2);max-width:700px;margin:22px auto 0}
  .reg-note li{margin:5px 0}

  /* right panel */
  .lp-panel{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
  .lp-tabs{display:flex;gap:18px;padding:12px 20px 0;border-bottom:1px solid var(--line);flex-shrink:0}
  .lp-tab{border:0;background:none;padding:6px 2px 12px;font-size:14px;font-weight:600;color:var(--muted2);border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
  .lp-tab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .lp-tab .cnt{font-size:11px;font-weight:800;background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px}
  .lp-pbody{flex:1;overflow:auto;padding:16px 20px 30px}

  .newc{border:1.5px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 4px 14px rgba(36,86,201,.12)}
  .newc .nh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .newc .nh .lab{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted2)}
  .ontag{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--hl);border:1px solid var(--hl-line);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:600;color:#6A5200}
  .ontag.general{background:var(--soft);border-color:var(--line);color:var(--muted2)}
  .ontag .rx{border:0;background:none;color:#9A7400;font-size:13px;line-height:1}
  .newc textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--ink)}
  .newc .foot{display:flex;align-items:center;gap:10px;margin-top:10px}
  .newc .foot .note{font-size:11.5px;color:var(--muted);flex:1}
  .mini{height:34px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid var(--line2);background:#fff;color:var(--ink)}
  .mini.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .mini.pri[disabled]{background:#C9CDD6;border-color:#C9CDD6;cursor:not-allowed}

  .clist-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .clist-h .t{font-size:14px;font-weight:700}
  .clist-h .r{font-size:12px;color:var(--muted)}
  .cmt{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .cmt:first-child{border-top:0}
  .cmt .cno{width:24px;height:24px;border-radius:50%;background:var(--pin);color:var(--pin-ink);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .cmt .cno.general{background:#fff;border:1.5px solid #C9CDD6;color:var(--muted2)}
  .cmt.sel{background:var(--hl);border-radius:8px;margin:0 -8px;padding:14px 8px}
  .cmt .top{display:flex;align-items:baseline;gap:8px}
  .cmt .en{font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
  .cmt .en:hover{color:var(--accent)}
  .cmt .tm{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .cmt .bd{font-size:13px;line-height:1.5;margin:4px 0 2px}
  .cmt .by{font-size:11.5px;color:var(--muted)}
  .cmt .acts{margin-top:6px;display:flex;gap:14px}
  .cmt .acts button{border:0;background:none;color:var(--accent);font-size:12px;font-weight:700;padding:0}

  .dlnote{display:flex;gap:10px;align-items:flex-start;background:#F3F6FB;border:1px solid #DCE6F6;border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--muted2);margin:18px 0 14px}
  .acc{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--muted2);margin:10px 0;line-height:1.45}
  .dlbtn{height:42px;padding:0 20px;background:var(--yellow);border:0;border-radius:8px;font-size:14px;font-weight:700;color:#1B2230;display:inline-flex;align-items:center;gap:8px;margin-top:6px}
  .dlbtn[disabled]{background:#E6E2C2;color:#9a9578;cursor:not-allowed}

  .gtab h3{font-size:14px;font-weight:800;margin:4px 0 10px}
  .gt{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12px;margin-bottom:18px}
  .gt .gr{display:grid;border-top:1px solid var(--line)}
  .gt .gr:first-child{border-top:0}
  .gt .gc{padding:7px 10px}
  .gt .gc+.gc{border-left:1px solid var(--line)}
  .gt .hd{background:var(--soft);font-weight:700}

  /* download report */
  .scrim{position:fixed;inset:0;background:rgba(20,24,33,.62);z-index:2000;overflow:auto;display:none}
  .scrim.open{display:block}
  .rbar{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:12px 20px;background:#1F2430;color:#fff;z-index:2}
  .rbar h2{margin:0;font-size:15px;font-weight:700}
  .rbar .x{margin-left:auto;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:7px;width:30px;height:30px;font-size:16px}
  .rbar .rdl{height:34px;padding:0 14px;border-radius:7px;border:0;background:var(--yellow);color:#1B2230;font-weight:700;font-size:13px}
  .rpages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:26px 14px 60px}
  .a4{width:794px;max-width:100%;min-height:1123px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:40px 44px 70px;position:relative;font-family:Arial,Helvetica,sans-serif;color:#111}
  .a4 .pgfoot{position:absolute;left:44px;right:44px;bottom:26px;display:flex;justify-content:space-between;border-top:1px solid #333;padding-top:8px;font-size:11px;font-weight:700}
  .legend{border:1px solid #D7DBE2;border-radius:6px;padding:12px 14px;font-size:11px;line-height:1.6;margin-bottom:22px}
  .legend .lh{font-weight:800;letter-spacing:.3px}
  .rstage{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px;position:relative}
  @media(max-width:1000px){.lp{top:0;left:0;width:100vw;height:100vh;border-radius:0}.lp-body{grid-template-columns:1fr}.lp-panel{border-left:0;border-top:1px solid var(--line);max-height:58vh}.lp-stage{grid-template-columns:40px minmax(0,1fr) 0}.lp.showcall .call{display:none}}
</style>
</head>
<body>
<div id="lpHost"></div>
<script>
/* ================================================================
   Label Preview — Comments & Font Heights
   Real product (Tangy Tomato Makhana) · IN / US / CA · per PRD + mock-up
   ================================================================ */
window.LabelPreview = (function(){
  "use strict";

  var FLAGS={

  };
  var CNAME={IN:'India',US:'United States',CA:'Canada'};

  var NUT=[['Energy (kcal)','420','210','11'],['Total Carbohydrate (g)','60','30','11'],['Total Sugars (g)','3','1.5','-'],['Added Sugars (g)','3','1.5','6'],['Protein (g)','16','8','15'],['Total Fat (g)','13','6.5','10'],['Saturated Fat (g)','8','4','20'],['Trans Fat (g)','0','0','-'],['Cholesterol (mg)','0','0','-'],['Sodium (mg)','890','445','23'],['Dietary Fibre (g)','5','2.5','-'],['Calcium (mg)','60','30','-']];
  var BRAND='CONNEDIT BUSINESS SOLUTIONS PVT. LTD.';

  var CARE_EMAIL='wecare@farmley.com', CARE_PHONE='+91-9899955931';
  var STORAGE='Store in a cool, dry and hygienic place. Once opened, consume within 7 days.';
  var STORAGE_FR='Conserver dans un endroit frais, sec et propre. Une fois ouvert, consommer dans les 7 jours.';

  /* ---------- per-country font-height callouts ---------- */

  // tag letter: a = primary (blue), b = secondary (amber)
  var CALL={
    IN:{
      brandlogo:{min:null,note:'Brand logo',page:1},
      name:{min:'2',tag:'FSSAI',cls:'b',mould:'4',note:'Product name',page:1},
      veg:{min:'8',tag:'FSSAI',cls:'b',mould:null,note:'Veg logo square · circle 4 mm',page:1},
      ingredients:{min:'2',tag:'FSSAI',cls:'b',mould:'4',note:'Ingredients',page:1},
      allergens:{min:'3',tag:'FSSAI',cls:'b',mould:null,note:'Mandatory declaration',page:1},
      nutrition:{min:'2',tag:'FSSAI',cls:'b',mould:'4',note:'Nutrition info',page:1},
      nifoot:{min:'2',tag:'FSSAI',cls:'b',mould:'4',note:'NI footnote',page:1},
      mfd:{min:'2',tag:'FSSAI',cls:'b',mould:'4',note:'Mfd. by, Lic. No.',page:1},
      consumer:{min:'2.5',tag:'LM',cls:'a',mould:'4',note:'Consumer care',page:1},
      netq:{min:'2.5',tag:'LM',cls:'a',mould:'4',note:'Net qty',page:2},
      mrp:{min:'2.5',tag:'LM',cls:'a',mould:'4',note:'MRP',page:2},
      usp:{min:'1.25',tag:'LM',cls:'a',mould:'2',note:'USP',page:2},
      batch:{min:'2',tag:'FSSAI',cls:'b',mould:'4',note:'Batch no.',page:2},
      pkgdate:{min:'2.5',tag:'LM',cls:'a',mould:'4',note:'Pkg. date',page:2},
      expiry:{min:'2.5',tag:'LM',cls:'a',mould:'4',note:'Expiry date',page:2},
      storage:{min:'2',tag:'FSSAI',cls:'b',mould:'4',note:'Storage',page:2},

    },
    US:{
      brandlogo:{min:null,note:'Brand logo',page:1},
      name:{min:'½ largest',tag:'FDA',cls:'a',note:'Statement of identity · 21 CFR 101.3',page:1},
      ingredients:{min:'1.6',tag:'FDA',cls:'a',note:'Ingredient list · 21 CFR 101.4',page:1},
      allergens:{min:'1.6',tag:'FDA',cls:'a',note:'“Contains” · FALCPA',page:1},
      nutrition:{min:'Cal 5.64 / val 2.12',tag:'FDA',cls:'a',note:'Nutrition Facts · 21 CFR 101.9(d)',page:1},
      mfd:{min:'1.6',tag:'FDA',cls:'a',note:'Firm name &amp; address · 21 CFR 101.5',page:1},
      coo:{min:'conspicuous',tag:'CBP',cls:'b',note:'Country of origin · 19 CFR 134',page:1},
      netq:{min:'min 4.8',tag:'FPLA',cls:'b',note:'Net quantity · 21 CFR 101.7 (PDP-based)',page:1},

    },

      ingredients:{min:'1.6',tag:'FDR',cls:'a',note:'List of ingredients · FDR B.01.008',page:1},
      allergens:{min:'1.6 bold',tag:'FDR',cls:'a',note:'“Contains / Contient” · B.01.010.1',page:1},

  };
  var EL_NAME={brandlogo:'Brand logo',name:'Product name',veg:'Veg / non-veg logo',ingredients:'Ingredients',allergens:'Allergens',nutrition:'Nutritional information',nifoot:'RDA footnote',mfd:'Manufacturer details',consumer:'Consumer care',coo:'Country of origin',netq:'Net quantity',mrp:'MRP',usp:'USP',batch:'Batch number',pkgdate:'Date of packaging',expiry:'Date of expiry',storage:'Storage instructions',packsym:'Pack symbol & barcode'};

  /* ---------- seed comments ---------- */

  /* ---------- gutters ---------- */
  function layoutGutters(){
    var card=document.getElementById('card'), addcol=document.getElementById('addcol'), callcol=document.getElementById('callcol');
    if(!card) return;
    var cr=card.getBoundingClientRect();
    addcol.innerHTML='';
    var cm=CALL[S.cc];
    callcol.innerHTML= cm.name&&cm.name.tag ? '<div class="callhdr" style="position:absolute;left:0;top:0;width:244px">MIN. TEXT HEIGHT<div class="sub">'+callHdrSub()+'</div></div>' : '<div class="callhdr" style="position:absolute;left:0;top:0;width:244px">MIN. TEXT HEIGHT<div class="sub">'+callHdrSub()+'</div></div>';
    var ids=Object.keys(cm);
    var items=ids.map(function(id){ var el=card.querySelector('.el[data-el="'+id+'"]'); return el?{id:id,y:Math.round(el.getBoundingClientRect().top-cr.top)}:null; }).filter(Boolean);
    items.forEach(function(it){
      var id=it.id;
      var existing=S.comments.filter(function(c){return c.cc===S.cc && c.el===id;})[0];
      if(existing){ var pin=document.createElement('div'); pin.className='pin'+(S.sel===existing.no?' sel':''); pin.style.top=it.y+'px'; pin.textContent=existing.no; pin.setAttribute('data-pinno',existing.no); addcol.appendChild(pin); }
      if(S.draft && S.draft.el===id){ var dp=document.createElement('div'); dp.className='pin dashed'; dp.style.top=it.y+'px'; dp.textContent=S.draft.no; addcol.appendChild(dp); }
      else { var ab=document.createElement('button'); ab.type='button'; ab.className='addbtn'; ab.style.top=it.y+'px'; ab.textContent='+'; ab.setAttribute('data-addel',id); addcol.appendChild(ab); }
    });
    var GAP=46, cursor=66;
    items.forEach(function(it){
      var c=cm[it.id];
      var y=Math.max(it.y, cursor); cursor=y+GAP;
      var r1 = c.min===null ? '<span class="nomin">No min. ht</span>'
             : '<span class="mm">'+c.min+(/mm|½|format|conspicuous|legible|largest/.test(c.min)?'':' mm')+'</span>'+(c.tag?'<span class="tag '+c.cls+'">'+c.tag+'</span>':'');
      var r2txt = c.min===null ? c.note : (c.note + (c.mould?' · '+c.mould+' mm moulded':''));
      var call=document.createElement('div'); call.className='call'; call.style.top=y+'px';
      call.innerHTML='<div class="tick"></div><div class="ca"><div class="r1">'+r1+'</div><div class="r2">'+r2txt+'</div></div>';
      callcol.appendChild(call);
    });
    // highlight
    card.querySelectorAll('.el.hl').forEach(function(n){n.classList.remove('hl');});
    var hlId=S.draft?S.draft.el:null;
    if(hlId&&hlId!=='general'){ var h=card.querySelector('.el[data-el="'+hlId+'"]'); if(h) h.classList.add('hl'); }
    if(S.sel){ var sc=S.comments.filter(function(c){return c.no===S.sel;})[0]; if(sc&&sc.el!=='general'){ var hh=card.querySelector('.el[data-el="'+sc.el+'"]'); if(hh) hh.classList.add('hl'); } }
  }
  function callHdrSub(){
    if(S.cc==='IN') return 'LM on PDP '+PDP.IN.a.area+' cm² · FSSAI on PDP '+PDP.IN.b.area+' cm² · moulded = blown, formed, moulded or perforated';
    if(S.cc==='US') return 'US · FDA 21 CFR / FPLA. Net-quantity height scales with the principal display panel area.';
    return 'Canada · FDR / SFCR. Labels are bilingual (English / French).';
  }

  /* ---------- render ---------- */
  function renderPanel(){
    document.getElementById('pbody').innerHTML=panel();
    document.getElementById('ccount').textContent=visibleComments().length;
    document.querySelectorAll('.lp-tab').forEach(function(t){ t.classList.toggle('on', t.getAttribute('data-tab')===S.tab); });
    var ov=document.getElementById('lpOverlay');
    ov.classList.toggle('commenting', S.comment);
    ov.classList.toggle('showcall', S.fontHeights);
  }
  function renderCountry(){
    document.getElementById('card').innerHTML=cardHTML(S.cc);
    document.getElementById('prodName').textContent=PRODUCT+' · '+CNAME[S.cc];
    document.querySelectorAll('#ccTabs .t').forEach(function(t){ t.classList.toggle('on', t.getAttribute('data-cc')===S.cc); });
  }
  function renderAll(){ renderCountry(); renderPanel(); requestAnimationFrame(layoutGutters); }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---------- interactions ---------- */
  function wire(){
    document.getElementById('lpClose').addEventListener('click', close);
    var tgF=document.getElementById('tgFont'), tgC=document.getElementById('tgComment');
    tgF.classList.toggle('on', S.fontHeights);
    tgF.addEventListener('click', function(){ S.fontHeights=!S.fontHeights; tgF.classList.toggle('on',S.fontHeights); renderAll(); });
    tgC.addEventListener('click', function(){ setComment(!S.comment); });
    document.getElementById('cbarDone').addEventListener('click', function(){ setComment(false); });
    document.getElementById('ccTabs').addEventListener('click', function(e){ var t=e.target.closest('.t'); if(!t) return; S.cc=t.getAttribute('data-cc'); S.sel=null; S.draft=null; renderAll(); });
    document.querySelector('.lp-tabs').addEventListener('click', function(e){ var t=e.target.closest('.lp-tab'); if(!t) return; S.tab=t.getAttribute('data-tab'); renderAll(); });
    document.getElementById('addcol').addEventListener('click', function(e){
      var add=e.target.closest('[data-addel]'); if(add){ startDraft(add.getAttribute('data-addel')); return; }
      var pin=e.target.closest('[data-pinno]'); if(pin){ selectComment(parseInt(pin.getAttribute('data-pinno'),10)); }
    });
    var pb=document.getElementById('pbody');
    pb.addEventListener('click', function(e){
      if(e.target.closest('#draftGen')){ S.draft.el='general'; renderAll(); return; }
      if(e.target.closest('#draftCancel')){ S.draft=null; renderAll(); return; }
      if(e.target.closest('#draftSave')){ saveDraft(); return; }
      var ed=e.target.closest('[data-edit]'); if(ed){ editComment(parseInt(ed.getAttribute('data-edit'),10)); return; }
      var del=e.target.closest('[data-del]'); if(del){ delComment(parseInt(del.getAttribute('data-del'),10)); return; }
      var fe=e.target.closest('[data-focusel]'); if(fe){ focusEl(fe.getAttribute('data-focusel')); return; }
      if(e.target.closest('#btnDownload')){ openReport(); return; }
      var card=e.target.closest('.cmt'); if(card){ selectComment(parseInt(card.getAttribute('data-cno'),10)); }
    });
    pb.addEventListener('input', function(e){ if(e.target.id==='draftText'){ S.draft.text=e.target.value; var b=document.getElementById('draftSave'); if(b) b.disabled=!e.target.value.trim(); } });
    pb.addEventListener('change', function(e){ if(e.target.id==='ac1'||e.target.id==='ac2') syncAccept(); });
    document.getElementById('repX').addEventListener('click', function(){ document.getElementById('repScrim').classList.remove('open'); });
    document.getElementById('repDl').addEventListener('click', function(){ window.print(); });
    document.getElementById('repScrim').addEventListener('click', function(e){ if(e.target.id==='repScrim') e.currentTarget.classList.remove('open'); });
    window.addEventListener('resize', function(){ requestAnimationFrame(layoutGutters); });
  }
  function setComment(on){ S.comment=on; if(!on) S.draft=null; document.getElementById('cbar').style.display=on?'flex':'none'; document.getElementById('tgComment').classList.toggle('on',on); renderAll(); }
  function startDraft(elId){ S.tab='comments'; S.sel=null; S.draft={el:elId,text:'',no:S.nextNo}; renderAll(); var ta=document.getElementById('draftText'); if(ta) ta.focus(); }
  function saveDraft(){ var d=S.draft; if(!d||!d.text.trim()) return; S.comments.push({no:S.nextNo++, cc:S.cc, el:d.el, text:d.text.trim(), author:'Meera K.', role:'you', time:nowStr(), mine:true}); S.draft=null; S.sel=S.nextNo-1; renderAll(); }
  function editComment(no){ var c=S.comments.filter(function(x){return x.no===no;})[0]; if(!c) return; S.draft={el:c.el,text:c.text,no:c.no}; S.comments=S.comments.filter(function(x){return x.no!==no;}); renderAll(); var ta=document.getElementById('draftText'); if(ta) ta.focus(); }
  function delComment(no){ S.comments=S.comments.filter(function(x){return x.no!==no;}); if(S.sel===no) S.sel=null; renderAll(); }
  function selectComment(no){ S.sel=(S.sel===no?null:no); S.tab='comments'; renderAll(); var c=S.comments.filter(function(x){return x.no===no;})[0]; if(c&&c.el!=='general'){ var t=document.querySelector('.el[data-el="'+c.el+'"]'); if(t) t.scrollIntoView({block:'center',behavior:'smooth'}); } }
  function focusEl(elId){ if(elId==='general') return; var t=document.querySelector('.el[data-el="'+elId+'"]'); if(t) t.scrollIntoView({block:'center',behavior:'smooth'}); }
  function syncAccept(){ var a=document.getElementById('ac1'),b=document.getElementById('ac2'),d=document.getElementById('btnDownload'); if(a&&b&&d) d.disabled=!(a.checked&&b.checked); }
  function nowStr(){ var d=new Date(),h=d.getHours(),m=d.getMinutes(),ap=h<12?'am':'pm'; h=h%12||12; return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+', '+h+':'+(m<10?'0':'')+m+' '+ap; }

  /* ---------- download report ---------- */
  function openReport(){
    var cc=S.cc, cm=CALL[cc], dt=reportDate();
    var pins=visibleComments();
    var maxPage=Math.max.apply(null,Object.keys(cm).map(function(k){return cm[k].page||1;}));
    var total=maxPage + 1 /*guidelines*/ + (pins.length?1:0);
    function pinFor(id){ var c=pins.filter(function(x){return x.el===id;})[0]; return c?'<span style="display:inline-flex;width:20px;height:20px;border-radius:50%;background:#F5B800;color:#1B2230;font-size:11px;font-weight:800;align-items:center;justify-content:center;margin-right:6px;vertical-align:middle">'+c.no+'</span>':''; }
    function callsFor(pageNo){ var ids=Object.keys(cm).filter(function(id){return (cm[id].page||1)===pageNo;}); return '<div>'+ids.map(function(id){var c=cm[id]; var r1=c.min===null?'<span style="font-family:monospace;font-weight:700;color:#56607A">No min. ht</span>':'<span style="font-family:monospace;font-weight:800">'+c.min+(/mm|½|format|conspicuous|legible|largest/.test(c.min)?'':' mm')+'</span> '+(c.tag?'<span class="tag '+c.cls+'">'+c.tag+'</span>':''); var r2=c.min===null?c.note:(c.note+(c.mould?' · '+c.mould+' mm moulded':'')); return '<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:14px"><div style="width:14px;border-top:1.5px dotted #B9C0CD;margin-top:8px"></div><div><div style="font-size:11px">'+r1+'</div><div style="font-size:10.5px;color:#6B6A68">'+r2+'</div></div></div>';}).join('')+'</div>'; }
    var legend='<div class="legend"><span class="lh">FONT-HEIGHT CALLOUTS</span> &nbsp; Minimum text height for each element, from the guidelines on page '+(maxPage+1)+'.<br>'
      + (cc==='IN'?'<span class="tag a">LM</span> Legal Metrology · PDP '+PDP.IN.a.area+' cm² &nbsp;&nbsp; <span class="tag b">FSSAI</span> FSS (Labelling &amp; Display) Regs · PDP '+PDP.IN.b.area+' cm²<br>moulded = blown, formed, moulded or perforated on container':callHdrSub())
      + (pins.length?' &nbsp;&nbsp; <span style="display:inline-flex;width:16px;height:16px;border-radius:50%;background:#F5B800;color:#1B2230;font-size:10px;font-weight:800;align-items:center;justify-content:center;vertical-align:middle">1</span> Comment · see page '+total:'')+'</div>';
    // insert pins into a rendered card
    var tmp=document.createElement('div'); tmp.innerHTML=cardHTML(cc);
    tmp.querySelectorAll('.el').forEach(function(n){ var id=n.getAttribute('data-el'); var c=pins.filter(function(x){return x.el===id;})[0]; if(c){ n.style.position='relative'; var p=document.createElement('span'); p.textContent=c.no; p.style.cssText='display:inline-flex;width:20px;height:20px;border-radius:50%;background:#F5B800;color:#1B2230;font-size:11px;font-weight:800;align-items:center;justify-content:center;margin-right:6px;vertical-align:middle'; n.insertBefore(p,n.firstChild); } });
    var html='';
    for(var pg=1; pg<=maxPage; pg++){
      var pageEls=Object.keys(cm).filter(function(id){return (cm[id].page||1)===pg;});
      // build a page card showing only this page's elements
      var frag=document.createElement('div'); frag.className='art'; frag.style.fontSize='12.5px';
      pageEls.forEach(function(id){ var src=tmp.querySelector('.el[data-el="'+id+'"]'); if(src){ var clone=src.cloneNode(true); clone.style.marginTop='12px'; frag.appendChild(clone); } });
      html+=a4((pg===1?legend:'')+'<div class="rstage"><div>'+frag.outerHTML+'</div>'+callsFor(pg)+'</div>', pg, total, dt, cc);
    }
    html+=a4('<div class="art">'+guidelinesHTML()+'</div>', maxPage+1, total, dt, cc);
    if(pins.length) html+=a4(commentsReport(dt,cc,cm), total, total, dt, cc);
    document.getElementById('rpages').innerHTML=html;
    var sc=document.getElementById('repScrim'); sc.classList.add('open'); sc.scrollTop=0;
  }
  function a4(inner,n,total,dt,cc){ return '<div class="a4">'+inner+'<div class="pgfoot"><span>'+PRODUCT+' · '+cc+'</span><span>Page '+n+' of '+total+'</span><span>'+dt+'</span></div></div>'; }
  function commentsReport(dt,cc,cm){
    var pins=visibleComments().slice().sort(function(a,b){return a.no-b.no;});
    var rows=pins.map(function(c){
      var general=c.el==='general';
      var pg=general?'Whole label':('Page '+((cm[c.el]&&cm[c.el].page)||1));
      var dot=general?'<span style="display:inline-flex;width:22px;height:22px;border-radius:50%;background:#fff;border:1.5px solid #C9CDD6;color:#56607A;font-size:12px;font-weight:800;align-items:center;justify-content:center">'+c.no+'</span>':'<span style="display:inline-flex;width:22px;height:22px;border-radius:50%;background:#F5B800;color:#1B2230;font-size:12px;font-weight:800;align-items:center;justify-content:center">'+c.no+'</span>';
      return '<tr style="border-top:1px solid #E4E6EA"><td style="padding:12px 8px;vertical-align:top">'+dot+'</td><td style="padding:12px 8px;vertical-align:top"><b>'+(general?'General':EL_NAME[c.el])+'</b><br><span style="color:#6B6A68;font-size:11px">'+pg+'</span></td><td style="padding:12px 8px;vertical-align:top">'+esc(c.text)+'</td><td style="padding:12px 8px;vertical-align:top">'+c.author+'<br><span style="color:#6B6A68;font-size:11px">'+c.role+'</span></td><td style="padding:12px 8px;vertical-align:top;white-space:nowrap">'+c.time+'</td></tr>';
    }).join('');
    return '<div class="art"><h2 style="margin:0 0 6px;font-size:22px">Comments</h2><div style="color:#6B6A68;font-size:12px;margin-bottom:14px">'+pins.length+' comments added in FoLSol before download. Recorded for documentation only; they are not tracked or resolved.</div><table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr style="text-align:left;border-bottom:2px solid #333"><th style="padding:8px">#</th><th style="padding:8px">Element</th><th style="padding:8px">Comment</th><th style="padding:8px">Added by</th><th style="padding:8px">Date &amp; time</th></tr>'+rows+'</table></div>';
  }
  function reportDate(){ var d=new Date(),h=d.getHours(),m=d.getMinutes(),ap=h<12?'am':'pm'; h=h%12||12; return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+', '+h+':'+(m<10?'0':'')+m+' '+ap; }

  /* ---------- open / close ---------- */
  function open(host,cc){
    S.host=host||document.body;
    S.comments=seedComments(); S.nextNo=6; S.sel=null; S.draft=null; S.comment=false; S.fontHeights=true; S.tab='comments';
    S.cc=(cc&&CALL[cc])?cc:'IN';
    var mount=document.createElement('div'); mount.id='lpMount'; mount.innerHTML=shell(); S.host.appendChild(mount);
    wire(); renderAll();
    document.documentElement.style.overflow='hidden';
  }
  function setCountry(cc){ if(cc&&CALL[cc]){ S.cc=cc; S.sel=null; S.draft=null; if(document.getElementById('lpMount')) renderAll(); } }
  function close(){ var m=document.getElementById('lpMount'); if(m) m.remove(); document.documentElement.style.overflow=''; try{ if(window.parent && window.parent!==window) window.parent.postMessage('lp-close','*'); }catch(e){} }

  // allow parent (index_26) to set the country
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='lp-country') setCountry(e.data.cc); });

  return { open:open, close:close, setCountry:setCountry };
})();

if(!window.__lpEmbed){ window.LabelPreview.open(document.getElementById('lpHost'), (location.hash||'').replace('#','')||'IN'); }
</script>
